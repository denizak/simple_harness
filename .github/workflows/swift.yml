# Swift CI: build + test on macOS and Linux.
# The Linux job verifies the harness portability (FoundationNetworking,
# bash shell, Glibc imports) on every push.
name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        # swift-actions/setup-swift v2 (pinned to a commit SHA)
        uses: swift-actions/setup-swift@7591e4f04c00624cb043783da51a7fd6ee0a6bf6
        with:
          swift-version: "6.2"
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
